zend_extension=xdebug.so

; Włącz tylko debugowanie (możesz dodać np. profile, coverage)
xdebug.mode=debug

; Xdebug ma się uruchamiać zawsze (autostart)
xdebug.start_with_request=yes

; Host, do którego ma się łączyć debugger
xdebug.client_host=172.17.0.1

; Port (w Xdebug 3 domyślnie 9003, ale możesz wymusić 9001)
xdebug.client_port=9001

; Pozostałe opcje
xdebug.cli_color=1
xdebug.show_local_vars=1
xdebug.scream=0

